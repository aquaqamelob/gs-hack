    prefs: { critical: [phone, ui], error: [sms, ui], warning: [ui], info: [ui] }
  - id: team-rates
    name: Team Rates
    kind: team
    email: rates-desk@bank.local
    onCall: tomasz
    prefs: { critical: [sms, email, ui], error: [email, ui], warning: [email, ui], info: [ui] }
  - id: counterparty-support
    name: Counterparty Support
    kind: team
    email: counterparty-support@bank.local
