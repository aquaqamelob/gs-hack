# Teams and people. prefs: severity → channels. working_hours: outside them, `outside` replaces the normal channels.
# People: role admin may change every rule (team filters) and every recipient; others change only their own
# filters and preferences. teams: whose alerts appear in that person's own view (My view).
# Events from unmapped schemas that match no rule go to the Unassigned inbox and to default_owner.
default_owner: team-platform
recipients:
  - id: team-platform
    name: Team Platform
    kind: team
    email: platform@bank.local
    onCall: piotr
    prefs: { critical: [email, ui], error: [email, ui], warning: [email, ui], info: [ui] }
  - id: team-settlements
    name: Team Settlements
    kind: team
    email: settlements@bank.local
    onCall: piotr
    prefs: { critical: [phone, sms, ui], error: [phone, sms, ui], warning: [email, ui], info: [ui] }
  - id: team-pricing
    name: Team Pricing
    kind: team
    email: pricing@bank.local
